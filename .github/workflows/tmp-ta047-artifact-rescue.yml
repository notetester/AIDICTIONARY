name: tmp-ta047-artifact-rescue

on:
  push:
    branches:
      - tmp/ta047-cross-publisher
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  rescue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate exact retained archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import urllib.request
          import zipfile

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          expected_sha = '2ec193ca4a27535403b149c8bbbc613ce088e40134406a79144bd80556539068'
          expected_size = 766_936
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'ta047-artifact-rescue',
          }

          artifacts = []
          for page in range(1, 21):
              url = f'https://api.github.com/repos/{repo}/actions/artifacts?per_page=100&page={page}'
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as response:
                  payload = json.load(response)
              batch = payload.get('artifacts', [])
              artifacts.extend(batch)
              if len(batch) < 100:
                  break

          print('TA047_ARTIFACT_COUNT=' + str(len(artifacts)))
          for artifact in artifacts:
              print('TA047_ARTIFACT=' + json.dumps({
                  'id': artifact.get('id'),
                  'name': artifact.get('name'),
                  'expired': artifact.get('expired'),
                  'size': artifact.get('size_in_bytes'),
                  'created_at': artifact.get('created_at'),
              }, sort_keys=True))

          found = None
          found_source = None
          for artifact in artifacts:
              if artifact.get('expired'):
                  continue
              artifact_id = artifact['id']
              url = f'https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}/zip'
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=120) as response:
                      zip_bytes = response.read()
                  with zipfile.ZipFile(io.BytesIO(zip_bytes)) as archive:
                      for member in archive.infolist():
                          if member.is_dir():
                              continue
                          data = archive.read(member)
                          digest = hashlib.sha256(data).hexdigest()
                          if len(data) == expected_size and digest == expected_sha:
                              found = data
                              found_source = f'artifact={artifact_id}:{artifact.get("name")};member={member.filename}'
                              break
              except Exception as exc:
                  print(f'TA047_ARTIFACT_SKIP={artifact_id}:{type(exc).__name__}:{exc}')
              if found is not None:
                  break

          if found is None:
              raise SystemExit('TA047_CANONICAL_ARTIFACT_NOT_FOUND')

          output = Path('/tmp/ta047-full.tar.xz')
          output.write_bytes(found)
          Path('/tmp/ta047-source.txt').write_text(found_source + '\n', encoding='utf-8')
          print('TA047_CANONICAL_ARTIFACT=' + found_source)
          print('TA047_CANONICAL_BYTES=' + str(len(found)))
          print('TA047_CANONICAL_SHA256=' + hashlib.sha256(found).hexdigest())
          PY

      - name: Publish immutable canonical delivery branch
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/ta047-publish
          rm -rf "$work"
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$work"
          cd "$work"
          git checkout -B ta047/canonical-delivery origin/main
          rm -rf transfer/ta047
          mkdir -p transfer/ta047/extracted
          cp /tmp/ta047-full.tar.xz transfer/ta047/ta047-full.tar.xz
          cp /tmp/ta047-source.txt transfer/ta047/SOURCE.txt
          python - <<'PY'
          import hashlib
          import io
          import json
          import lzma
          from pathlib import Path, PurePosixPath
          import tarfile

          root = Path('transfer/ta047')
          archive = (root / 'ta047-full.tar.xz').read_bytes()
          expected_xz = '2ec193ca4a27535403b149c8bbbc613ce088e40134406a79144bd80556539068'
          expected_tar = '19cee3be488a52f1d3cfd5013ded8823c1dc6547172f067cbd60c418cf94119c'
          if len(archive) != 766_936 or hashlib.sha256(archive).hexdigest() != expected_xz:
              raise SystemExit('TA047_XZ_IDENTITY_MISMATCH')
          tar_bytes = lzma.decompress(archive)
          if hashlib.sha256(tar_bytes).hexdigest() != expected_tar:
              raise SystemExit('TA047_TAR_IDENTITY_MISMATCH')

          files = []
          with tarfile.open(fileobj=io.BytesIO(tar_bytes), mode='r:') as tf:
              members = [m for m in tf.getmembers() if m.isfile()]
              if len(members) != 48:
                  raise SystemExit(f'TA047_FILE_COUNT_MISMATCH:{len(members)}')
              for member in members:
                  normalized = member.name.removeprefix('./')
                  path = PurePosixPath(normalized)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'TA047_UNSAFE_PATH:{normalized}')
                  if path.suffix.lower() in {'.dwg', '.dxf', '.exe', '.dll', '.so', '.dylib'}:
                      raise SystemExit(f'TA047_FORBIDDEN_PATH:{normalized}')
                  data = tf.extractfile(member).read()
                  target = root / 'extracted' / Path(*path.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  files.append({'path': normalized, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})

          manifest = {
              'schema': 'ta047.canonical-gitlink.v1',
              'archive_bytes': len(archive),
              'archive_sha256': expected_xz,
              'tar_sha256': expected_tar,
              'regular_files': len(files),
              'files': files,
          }
          (root / 'GITLINK_MANIFEST.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          (root / 'README.md').write_text('''# TA-047 canonical remaining-DWG inventory delivery\n\nThis directory contains the exact canonical XZ archive and its safely extracted 48-file inventory tree.\n\n- drawings: 15 / 15\n- archive bytes: 766,936\n- archive SHA-256: `2ec193ca4a27535403b149c8bbbc613ce088e40134406a79144bd80556539068`\n- restored TAR SHA-256: `19cee3be488a52f1d3cfd5013ded8823c1dc6547172f067cbd60c418cf94119c`\n- source DWG / temporary DXF / parser runtime: not included\n\nThe GAME repository pins this exact commit through a gitlink.\n''', encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add transfer/ta047
          git commit -m '[INFRA][TA-047] Publish canonical remaining-DWG inventories'
          git push --force origin HEAD:ta047/canonical-delivery
        env:
          GITHUB_TOKEN: ${{ github.token }}
