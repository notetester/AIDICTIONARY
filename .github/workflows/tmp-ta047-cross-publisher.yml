name: tmp-ta047-cross-publisher

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GAME_TOKEN: ${{ secrets.GAME_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
      PAT: ${{ secrets.PAT }}
      REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
      CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
      GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Locate canonical TA-047 artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ta047-artifacts /tmp/ta047-found
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.id,.name] | @tsv' > /tmp/artifacts.tsv
          cat /tmp/artifacts.tsv
          found=''
          while IFS=$'\t' read -r id name; do
            case "${name,,}" in
              *ta047*|*ta-047*|*dwg*inventory*|*dwg*full*) ;;
              *) continue ;;
            esac
            rm -rf /tmp/ta047-artifacts/*
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > /tmp/artifact.zip
            unzip -q /tmp/artifact.zip -d /tmp/ta047-artifacts || continue
            candidate="$(find /tmp/ta047-artifacts -type f -name 'ta047-full.tar.xz' -print -quit)"
            if [[ -n "$candidate" ]]; then
              hash="$(sha256sum "$candidate" | awk '{print $1}')"
              size="$(stat -c %s "$candidate")"
              if [[ "$hash" == '2ec193ca4a27535403b149c8bbbc613ce088e40134406a79144bd80556539068' && "$size" == '766936' ]]; then
                cp "$candidate" /tmp/ta047-found/ta047-full.tar.xz
                printf '%s\n' "$id" > /tmp/ta047-found/artifact-id.txt
                printf '%s\n' "$name" > /tmp/ta047-found/artifact-name.txt
                found=1
                break
              fi
            fi
          done < /tmp/artifacts.tsv
          [[ -n "$found" ]] || { echo 'TA047_CANONICAL_ARTIFACT=NOT_FOUND'; exit 1; }
          echo "TA047_CANONICAL_ARTIFACT_ID=$(cat /tmp/ta047-found/artifact-id.txt)"
          echo "TA047_CANONICAL_ARTIFACT_NAME=$(cat /tmp/ta047-found/artifact-name.txt)"
          sha256sum /tmp/ta047-found/ta047-full.tar.xz
      - name: Publish public transfer branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -B tmp/ta047-transfer origin/main
          rm -rf transfer
          mkdir -p transfer
          cp /tmp/ta047-found/ta047-full.tar.xz transfer/ta047-full.tar.xz
          cat > transfer/TA047_SOURCE.txt <<EOF
          archive_bytes=766936
          archive_sha256=2ec193ca4a27535403b149c8bbbc613ce088e40134406a79144bd80556539068
          tar_sha256=19cee3be488a52f1d3cfd5013ded8823c1dc6547172f067cbd60c418cf94119c
          artifact_id=$(cat /tmp/ta047-found/artifact-id.txt)
          artifact_name=$(cat /tmp/ta047-found/artifact-name.txt)
          EOF
          git add transfer
          git commit -m '[TEMP][TA-047] Publish canonical transfer' || true
          git push --force origin HEAD:tmp/ta047-transfer
      - name: Push complete delivery to GAME when token exists
        shell: bash
        run: |
          set -euo pipefail
          token=''
          token_name=''
          for name in GAME_TOKEN GH_PAT PAT REPO_TOKEN CROSS_REPO_TOKEN GITHUB_PAT; do
            value="${!name:-}"
            if [[ -n "$value" ]]; then token="$value"; token_name="$name"; break; fi
          done
          if [[ -z "$token" ]]; then
            echo 'TA047_CROSS_REPO_TOKEN=NONE'
            exit 0
          fi
          echo "TA047_CROSS_REPO_TOKEN=${token_name}"
          git clone "https://x-access-token:${token}@github.com/notetester/GAME.git" /tmp/GAME
          cd /tmp/GAME
          git fetch origin main tech-art/ta047-final-delivery || true
          git checkout -B tech-art/ta047-final-delivery origin/main
          rm -rf out/dwg-inventory/ta047-payload out/dwg-inventory/TA047_DELIVERY.md tools/dwg/validate_ta047_delivery.py .github/workflows/tmp-ta047-recover.yml
          mkdir -p out/dwg-inventory/ta047-payload tools/dwg
          cp /tmp/ta047-found/ta047-full.tar.xz /tmp/ta047-full.tar.xz
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, lzma
          archive=Path('/tmp/ta047-full.tar.xz').read_bytes()
          assert len(archive)==766936
          assert hashlib.sha256(archive).hexdigest()=='2ec193ca4a27535403b149c8bbbc613ce088e40134406a79144bd80556539068'
          tar=lzma.decompress(archive)
          assert hashlib.sha256(tar).hexdigest()=='19cee3be488a52f1d3cfd5013ded8823c1dc6547172f067cbd60c418cf94119c'
          encoded=base64.b64encode(archive).decode('ascii')
          root=Path('out/dwg-inventory/ta047-payload')
          parts=[encoded[i:i+16384] for i in range(0,len(encoded),16384)]
          assert len(parts)==63
          for i,part in enumerate(parts,1): (root/f'part-{i:04d}.b64').write_text(part,encoding='ascii')
          meta={'schema':'ta047.base64-xz.v2','part_count':63,'part_chars':16384,'archive_bytes':766936,'archive_sha256':'2ec193ca4a27535403b149c8bbbc613ce088e40134406a79144bd80556539068','tar_sha256':'19cee3be488a52f1d3cfd5013ded8823c1dc6547172f067cbd60c418cf94119c'}
          (root/'_transport.json').write_text(json.dumps(meta,indent=2,sort_keys=True)+'\n')
          (root/'README.md').write_text('# TA-047 canonical payload\n\nConcatenate `part-0001.b64` through `part-0063.b64`, Base64-decode, then XZ-decompress.\n')
          PY
          cat > tools/dwg/validate_ta047_delivery.py <<'PY'
          #!/usr/bin/env python3
          from pathlib import Path
          import base64,hashlib,io,json,lzma,tarfile
          root=Path(__file__).resolve().parents[2]
          payload=root/'out/dwg-inventory/ta047-payload'
          parts=sorted(payload.glob('part-*.b64'))
          expected=[f'part-{i:04d}.b64' for i in range(1,64)]
          assert [p.name for p in parts]==expected
          meta=json.loads((payload/'_transport.json').read_text())
          assert meta['part_count']==63 and meta['archive_bytes']==766936
          archive=base64.b64decode(b''.join(b''.join(p.read_bytes().split()) for p in parts),validate=True)
          assert len(archive)==766936
          assert hashlib.sha256(archive).hexdigest()=='2ec193ca4a27535403b149c8bbbc613ce088e40134406a79144bd80556539068'
          tar=lzma.decompress(archive)
          assert hashlib.sha256(tar).hexdigest()=='19cee3be488a52f1d3cfd5013ded8823c1dc6547172f067cbd60c418cf94119c'
          with tarfile.open(fileobj=io.BytesIO(tar),mode='r:') as tf:
            names=[m.name for m in tf.getmembers() if m.isfile()]
          assert len(names)==48
          assert {'out/dwg-inventory/_manifest.json','out/dwg-inventory/_receipt.json','out/dwg-inventory/_report.md'}<=set(names)
          dirs={str(Path(n).parent) for n in names if n.endswith('/_inventory.json')}
          assert len(dirs)==15
          for d in dirs:
            for leaf in ('_inventory.json','_inventory_report.md','_receipt.json'): assert f'{d}/{leaf}' in names
          assert not any(Path(n).suffix.lower() in {'.dwg','.dxf','.exe','.dll','.so','.dylib'} for n in names)
          print('TA047_DELIVERY_PARTS=63')
          print('TA047_DELIVERY_DRAWINGS=15')
          print('TA047_DELIVERY_XZ_BYTES=766936')
          print('TA047_DELIVERY_XZ_SHA256=2ec193ca4a27535403b149c8bbbc613ce088e40134406a79144bd80556539068')
          print('TA047_DELIVERY_TAR_SHA256=19cee3be488a52f1d3cfd5013ded8823c1dc6547172f067cbd60c418cf94119c')
          print('TA047_DELIVERY_RESULT=PASS')
          PY
          cat > out/dwg-inventory/TA047_DELIVERY.md <<'EOF'
          # TA-047 — Remaining supplied-DWG inventory delivery

          Tracking: #3395

          - drawings: 15 / 15
          - raw / expanded entities: 756,522 / 2,160,128
          - layers / block definitions / text candidates: 2,024 / 34,221 / 56,057
          - parser warnings / unknown entities: 0 / 0
          - XZ bytes: 766,936
          - XZ SHA-256: `2ec193ca4a27535403b149c8bbbc613ce088e40134406a79144bd80556539068`
          - restored TAR SHA-256: `19cee3be488a52f1d3cfd5013ded8823c1dc6547172f067cbd60c418cf94119c`
          - ordered Base64 payload parts: 63

          The archive contains aggregate manifest/report/receipt files and deterministic inventory/report/receipt files for all 15 drawings. No source DWG, temporary DXF, LibreDWG runtime, executable, shared library, or parser binary is committed.

          Verify: `python tools/dwg/validate_ta047_delivery.py`
          EOF
          python tools/dwg/validate_ta047_delivery.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add out/dwg-inventory tools/dwg/validate_ta047_delivery.py .github/workflows/tmp-ta047-recover.yml
          git commit -m '[TECH ART][TA-047] Deliver canonical remaining-DWG inventories'
          git push --force origin HEAD:tech-art/ta047-final-delivery
          GH_TOKEN="$token" gh api repos/notetester/GAME/pulls/3989 -X PATCH -f state=open >/dev/null || true
