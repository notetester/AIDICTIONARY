name: Temporary 32-bit LibreDWG artifact

on:
  pull_request:
    paths:
      - .github/tmp-libredwg-parser-trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-native-libredwg-i386:
    runs-on: ubuntu-22.04
    steps:
      - name: Build fixed 32-bit native LibreDWG tools
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config texinfo \
            gcc-multilib g++-multilib libc6-dev-i386 patchelf \
            libxml2-dev:i386 libpcre2-dev:i386 zlib1g-dev:i386
          git clone --filter=blob:none https://github.com/mlightcad/libredwg-web.git src
          cd src
          git checkout b70b5573a6bf2345e5fb10f2adff7fb74a8123c5
          git submodule update --init --recursive
          sh autogen.sh
          CFLAGS='-O2 -m32' CXXFLAGS='-O2 -m32' LDFLAGS='-m32' \
            ./configure --disable-shared --enable-static
          make -j2
          file programs/dwg2dxf | tee ../FILE.txt
          grep -q 'ELF 32-bit' ../FILE.txt
          mkdir -p ../artifact/bin ../artifact/lib
          cp programs/dwg2dxf programs/dwgread ../artifact/bin/
          interp="$(patchelf --print-interpreter programs/dwg2dxf)"
          cp -L "$interp" ../artifact/lib/ld-linux.so.2
          ldd programs/dwg2dxf | awk '/=> \/.*\(0x/{print $3} /^\//{print $1}' | \
            while read -r lib; do cp -L "$lib" ../artifact/lib/; done
          cat > ../artifact/run-dwg2dxf.sh <<'SH'
          #!/bin/sh
          set -eu
          root="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "$root/lib/ld-linux.so.2" --library-path "$root/lib" "$root/bin/dwg2dxf" "$@"
          SH
          cat > ../artifact/run-dwgread.sh <<'SH'
          #!/bin/sh
          set -eu
          root="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "$root/lib/ld-linux.so.2" --library-path "$root/lib" "$root/bin/dwgread" "$@"
          SH
          chmod +x ../artifact/run-*.sh
          ../artifact/run-dwg2dxf.sh --version | tee ../artifact/VERSION.txt
          cd ..
          find artifact -type f -print0 | sort -z | xargs -0 sha256sum > artifact/SHA256SUMS

      - name: Upload 32-bit native LibreDWG artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-libredwg-i386-b70b5573
          path: artifact/
          if-no-files-found: error
          retention-days: 1
