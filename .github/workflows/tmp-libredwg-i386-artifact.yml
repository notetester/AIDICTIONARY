name: Temporary 32-bit LibreDWG artifact

on:
  pull_request:
    paths:
      - .github/tmp-libredwg-parser-trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-native-libredwg-i386:
    runs-on: ubuntu-22.04
    steps:
      - name: Build fixed minimal 32-bit native LibreDWG tools
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifact/logs
          exec > >(tee artifact/logs/build.log) 2>&1
          set -e
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool texinfo \
            gcc-multilib g++-multilib libc6-dev-i386 patchelf qemu-user-static
          git clone --filter=blob:none https://github.com/mlightcad/libredwg-web.git src
          cd src
          git checkout b70b5573a6bf2345e5fb10f2adff7fb74a8123c5
          git submodule update --init --recursive
          sh autogen.sh
          PKG_CONFIG=/bin/false \
          CFLAGS='-O2 -m32' CXXFLAGS='-O2 -m32' LDFLAGS='-m32' \
          ac_cv_lib_xml2_newXMLEntity=no \
          ac_cv_lib_pcre2_8_pcre2_config_8=no \
          ac_cv_lib_pcre2_16_pcre2_config_16=no \
            ./configure --disable-shared --enable-static --disable-bindings --disable-docs --enable-release
          make -C src -j2
          make -C programs -j2 dwg2dxf dwgread
          file programs/dwg2dxf programs/dwgread | tee ../FILE.txt
          grep -q 'dwg2dxf: ELF 32-bit' ../FILE.txt
          grep -q 'dwgread: ELF 32-bit' ../FILE.txt
          mkdir -p ../artifact/bin ../artifact/lib
          cp programs/dwg2dxf programs/dwgread ../artifact/bin/
          cp /usr/bin/qemu-i386-static ../artifact/bin/
          interp="$(patchelf --print-interpreter programs/dwg2dxf)"
          cp -L "$interp" ../artifact/lib/ld-linux.so.2
          ldd programs/dwg2dxf | awk '/=> \/.*\(0x/{print $3} /^\//{print $1}' | \
            while read -r lib; do cp -L "$lib" ../artifact/lib/; done
          cat > ../artifact/run-dwg2dxf.sh <<'SH'
          #!/bin/sh
          set -eu
          root="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "$root/bin/qemu-i386-static" -L "$root" "$root/bin/dwg2dxf" "$@"
          SH
          cat > ../artifact/run-dwgread.sh <<'SH'
          #!/bin/sh
          set -eu
          root="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "$root/bin/qemu-i386-static" -L "$root" "$root/bin/dwgread" "$@"
          SH
          chmod +x ../artifact/run-*.sh
          ../artifact/run-dwgread.sh --version | tee ../artifact/VERSION.txt
          cd ..
          find artifact -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > artifact/SHA256SUMS

      - name: Upload 32-bit native LibreDWG artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: native-libredwg-i386-qemu-b70b5573
          path: artifact/
          if-no-files-found: error
          retention-days: 1

      - name: Upload 32-bit build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-libredwg-i386-qemu-build-log
          path: artifact/logs/
          if-no-files-found: warn
          retention-days: 1
