name: tmp-ta047-comment-recovery

on:
  push:
    branches: [tmp/ta047-comment-recovery]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/ta047-comment-recovery
          fetch-depth: 0

      - name: Reconstruct and verify canonical archive
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import lzma
          import os
          from pathlib import Path, PurePosixPath
          import tarfile
          import urllib.request

          ISSUE = 15
          TOTAL = 19
          B64_CHARS = 1_022_584
          XZ_BYTES = 766_936
          XZ_SHA = "2ec193ca4a27535403b149c8bbbc613ce088e40134406a79144bd80556539068"
          TAR_SHA = "19cee3be488a52f1d3cfd5013ded8823c1dc6547172f067cbd60c418cf94119c"
          FORBIDDEN = {".dwg", ".dxf", ".exe", ".dll", ".so", ".dylib"}

          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "TA047-comment-recovery/1",
          }
          comments = []
          page = 1
          while True:
              url = f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/{ISSUE}/comments?per_page=100&page={page}"
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=60) as response:
                  batch = json.load(response)
              comments.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          chunks = {}
          for comment in comments:
              body = comment.get("body") or ""
              lines = body.splitlines()
              if not lines or not lines[0].startswith("TA047_CHUNK_V1 "):
                  continue
              fields = dict(item.split("=", 1) for item in lines[0].split()[1:])
              index = int(fields["index"])
              total = int(fields["total"])
              chars = int(fields["chars"])
              wanted_sha = fields["sha256"]
              if total != TOTAL or index in chunks or not (1 <= index <= TOTAL):
                  raise SystemExit(f"invalid chunk header: {lines[0]}")
              try:
                  begin = lines.index("BEGIN_TA047_BASE64") + 1
                  end = lines.index("END_TA047_BASE64")
              except ValueError as exc:
                  raise SystemExit(f"missing chunk markers: {index}") from exc
              payload = "".join(lines[begin:end]).strip()
              actual_sha = hashlib.sha256(payload.encode("ascii")).hexdigest()
              if len(payload) != chars or actual_sha != wanted_sha:
                  raise SystemExit(f"chunk identity mismatch: {index}")
              chunks[index] = payload

          if sorted(chunks) != list(range(1, TOTAL + 1)):
              raise SystemExit(f"chunk set incomplete: {sorted(chunks)}")
          encoded = "".join(chunks[i] for i in range(1, TOTAL + 1))
          if len(encoded) != B64_CHARS:
              raise SystemExit(f"base64 length mismatch: {len(encoded)}")
          archive = base64.b64decode(encoded, validate=True)
          if len(archive) != XZ_BYTES or hashlib.sha256(archive).hexdigest() != XZ_SHA:
              raise SystemExit("canonical XZ identity mismatch")
          raw = lzma.decompress(archive)
          if hashlib.sha256(raw).hexdigest() != TAR_SHA:
              raise SystemExit("restored TAR identity mismatch")

          root = Path("/tmp/ta047-canonical/transfer/ta047")
          extracted = root / "extracted"
          extracted.mkdir(parents=True, exist_ok=True)
          (root / "ta047-full.tar.xz").write_bytes(archive)
          records = []
          names = []
          with tarfile.open(fileobj=io.BytesIO(raw), mode="r:") as bundle:
              members = [member for member in bundle.getmembers() if member.isfile()]
              if len(members) != 48:
                  raise SystemExit(f"regular-file count mismatch: {len(members)}")
              for member in members:
                  name = member.name
                  while name.startswith("./"):
                      name = name[2:]
                  path = PurePosixPath(name)
                  if not name or path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe path: {name!r}")
                  if path.suffix.lower() in FORBIDDEN:
                      raise SystemExit(f"forbidden file: {name}")
                  data = bundle.extractfile(member).read()
                  target = extracted / Path(*path.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  names.append(path.as_posix())
                  records.append({
                      "path": path.as_posix(),
                      "bytes": len(data),
                      "sha256": hashlib.sha256(data).hexdigest(),
                  })

          if len(set(names)) != 48:
              raise SystemExit("duplicate TAR paths")
          values = set(names)
          aggregates = {
              "out/dwg-inventory/_manifest.json",
              "out/dwg-inventory/_receipt.json",
              "out/dwg-inventory/_report.md",
          }
          if not aggregates <= values:
              raise SystemExit("aggregate files missing")
          drawings = sorted({str(PurePosixPath(name).parent) for name in names if name.endswith("/_inventory.json")})
          if len(drawings) != 15:
              raise SystemExit(f"drawing count mismatch: {len(drawings)}")
          for directory in drawings:
              required = {
                  f"{directory}/_inventory.json",
                  f"{directory}/_inventory_report.md",
                  f"{directory}/_receipt.json",
              }
              if not required <= values:
                  raise SystemExit(f"incomplete drawing triplet: {directory}")

          manifest = {
              "schema": "ta047.canonical-gitlink.v1",
              "archive_bytes": XZ_BYTES,
              "archive_sha256": XZ_SHA,
              "tar_sha256": TAR_SHA,
              "regular_files": 48,
              "drawings": 15,
              "files": sorted(records, key=lambda item: item["path"]),
          }
          (root / "GITLINK_MANIFEST.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          (root / "README.md").write_text(
              "# TA-047 canonical remaining-DWG inventory delivery\n\n"
              "Exact XZ plus safely extracted 48-file tree for 15/15 drawings. "
              "No source DWG, temporary DXF, parser runtime, or executable.\n",
              encoding="utf-8",
          )
          print("TA047_COMMENT_RECOVERY=PASS")
          print(f"TA047_XZ_SHA256={XZ_SHA}")
          print(f"TA047_TAR_SHA256={TAR_SHA}")
          PY

      - name: Publish canonical branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git checkout -B ta047/canonical-delivery origin/main
          rm -rf transfer/ta047
          mkdir -p transfer
          cp -a /tmp/ta047-canonical/transfer/ta047 transfer/ta047
          git add transfer/ta047
          git commit -m '[INFRA][TA-047] Restore canonical remaining-DWG inventories'
          git push --force origin HEAD:ta047/canonical-delivery
