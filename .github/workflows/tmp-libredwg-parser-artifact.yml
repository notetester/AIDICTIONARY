name: Temporary LibreDWG parser artifact

on:
  pull_request:
    paths:
      - .github/tmp-libredwg-parser-trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-parser:
    runs-on: ubuntu-22.04
    steps:
      - name: Download fixed upstream parser files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          curl -fL --retry 4 --retry-delay 2 \
            'https://cdn.jsdelivr.net/npm/@mlightcad/libredwg-converter@3.12.1/dist/libredwg-parser-worker.js' \
            -o artifact/libredwg-parser-worker.js
          curl -fL --retry 4 --retry-delay 2 \
            'https://cdn.jsdelivr.net/npm/@mlightcad/libredwg-converter@3.12.1/dist/libredwg-converter.umd.cjs' \
            -o artifact/libredwg-converter.umd.cjs
          curl -fL --retry 4 --retry-delay 2 \
            'https://cdn.jsdelivr.net/npm/@mlightcad/libredwg-converter@3.12.1/package.json' \
            -o artifact/package.json
          sha256sum artifact/* | tee artifact/SHA256SUMS
          test "$(stat -c%s artifact/libredwg-parser-worker.js)" -gt 12000000

      - name: Upload parser artifact
        uses: actions/upload-artifact@v4
        with:
          name: libredwg-parser-runtime-3.12.1
          path: artifact/
          if-no-files-found: error
          retention-days: 1

  package-ezdxf:
    runs-on: ubuntu-22.04
    steps:
      - name: Package fixed ezdxf runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/py
          python -m pip install --disable-pip-version-check --no-compile \
            --target artifact/py 'ezdxf==1.4.2'
          python - <<'PY'
          import sys
          sys.path.insert(0, 'artifact/py')
          import ezdxf
          assert ezdxf.__version__ == '1.4.2', ezdxf.__version__
          print(ezdxf.__version__)
          PY
          find artifact -type f -print0 | sort -z | xargs -0 sha256sum > artifact/SHA256SUMS

      - name: Upload ezdxf artifact
        uses: actions/upload-artifact@v4
        with:
          name: ezdxf-runtime-1.4.2
          path: artifact/
          if-no-files-found: error
          retention-days: 1
