name: ta047-persist-chunks

on:
  push:
    branches: [main]
    paths:
      - '.ta047-main-rescue-trigger'
      - '.github/workflows/tmp-ta047-main-rescue.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  persist:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate archive and persist fixed chunks on main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import urllib.request
          import zipfile

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          expected_size = 766_936
          expected_sha = '2ec193ca4a27535403b149c8bbbc613ce088e40134406a79144bd80556539068'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'ta047-persist-chunks',
          }

          artifacts = []
          for page in range(1, 21):
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/actions/artifacts?per_page=100&page={page}',
                  headers=headers,
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  batch = json.load(response).get('artifacts', [])
              artifacts.extend(batch)
              if len(batch) < 100:
                  break

          report = {'artifact_count': len(artifacts), 'artifacts': [], 'found': None}
          found = None
          for artifact in artifacts:
              item = {key: artifact.get(key) for key in (
                  'id', 'name', 'expired', 'size_in_bytes', 'created_at', 'expires_at'
              )}
              item['members'] = []
              if not artifact.get('expired'):
                  try:
                      req = urllib.request.Request(
                          f'https://api.github.com/repos/{repo}/actions/artifacts/{artifact["id"]}/zip',
                          headers=headers,
                      )
                      with urllib.request.urlopen(req, timeout=120) as response:
                          zip_bytes = response.read()
                      with zipfile.ZipFile(io.BytesIO(zip_bytes)) as archive:
                          for member in archive.infolist():
                              if member.is_dir():
                                  continue
                              data = archive.read(member)
                              digest = hashlib.sha256(data).hexdigest()
                              item['members'].append({
                                  'name': member.filename,
                                  'bytes': len(data),
                                  'sha256': digest,
                              })
                              if len(data) == expected_size and digest == expected_sha:
                                  found = data
                                  report['found'] = {
                                      'artifact_id': artifact['id'],
                                      'artifact_name': artifact.get('name'),
                                      'member': member.filename,
                                  }
                                  break
                  except Exception as exc:
                      item['error'] = f'{type(exc).__name__}: {exc}'
              report['artifacts'].append(item)
              if found is not None:
                  break

          root = Path('transfer/ta047')
          chunks_dir = root / 'chunks'
          chunks_dir.mkdir(parents=True, exist_ok=True)
          for old in chunks_dir.glob('part-*.b64'):
              old.unlink()
          (root / 'ARTIFACT_SCAN_REPORT.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )

          if found is None:
              (root / 'NOT_FOUND.json').write_text(json.dumps({
                  'status': 'not_found',
                  'expected_bytes': expected_size,
                  'expected_sha256': expected_sha,
              }, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          else:
              not_found = root / 'NOT_FOUND.json'
              if not_found.exists():
                  not_found.unlink()
              encoded = base64.b64encode(found).decode('ascii')
              chunk_chars = 100_000
              chunks = [encoded[i:i + chunk_chars] for i in range(0, len(encoded), chunk_chars)]
              records = []
              for index, text in enumerate(chunks, 1):
                  name = f'part-{index:04d}.b64'
                  (chunks_dir / name).write_text(text + '\n', encoding='ascii')
                  records.append({
                      'path': f'transfer/ta047/chunks/{name}',
                      'base64_chars': len(text),
                      'text_sha256': hashlib.sha256(text.encode('ascii')).hexdigest(),
                  })
              manifest = {
                  'schema': 'ta047.chunked-custody.v1',
                  'archive_bytes': len(found),
                  'archive_sha256': hashlib.sha256(found).hexdigest(),
                  'base64_chars': len(encoded),
                  'chunk_chars': chunk_chars,
                  'chunk_count': len(chunks),
                  'chunks': records,
                  'source': report['found'],
              }
              (root / 'CHUNK_MANIFEST.json').write_text(
                  json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8'
              )
              (root / 'README.md').write_text(
                  '# TA-047 fixed chunk custody\n\n'
                  'Concatenate `chunks/part-*.b64` in lexical order, base64-decode, '
                  'and verify SHA-256 `2ec193ca4a27535403b149c8bbbc613ce088e40134406a79144bd80556539068`.\n',
                  encoding='utf-8',
              )
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add transfer/ta047
          if git diff --cached --quiet; then
            echo 'TA047_PERSIST_RESULT=NO_CHANGE'
            exit 0
          fi
          git commit -m '[INFRA][TA-047] Persist canonical archive as fixed chunks'
          git push origin HEAD:main
