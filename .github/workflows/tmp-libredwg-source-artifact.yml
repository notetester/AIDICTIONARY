name: Temporary LibreDWG source artifact

on:
  pull_request:
    paths:
      - .github/tmp-libredwg-parser-trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-source:
    runs-on: ubuntu-22.04
    steps:
      - name: Package fixed upstream source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/mlightcad/libredwg-web.git src
          cd src
          git checkout b70b5573a6bf2345e5fb10f2adff7fb74a8123c5
          git submodule update --init --recursive
          cd ..
          tar --exclude='.git' -czf libredwg-source-b70b5573.tar.gz src
          sha256sum libredwg-source-b70b5573.tar.gz > SHA256SUMS

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: libredwg-source-b70b5573
          path: |
            libredwg-source-b70b5573.tar.gz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 1
