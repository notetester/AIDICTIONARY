name: tmp-ta047-publish-transfer

on:
  push:
    branches:
      - tmp/ta047-publish-trigger
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate exact TA-047 archive in retained artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          EXPECTED_XZ_SHA256: 2ec193ca4a27535403b149c8bbbc613ce088e40134406a79144bd80556539068
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import io
          import json
          import os
          import pathlib
          import sys
          import urllib.request
          import zipfile

          token = os.environ['GH_TOKEN']
          repo = os.environ['GH_REPOSITORY']
          expected = os.environ['EXPECTED_XZ_SHA256']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'ta047-transfer-publisher',
          }

          def get(url: str) -> bytes:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=120) as response:
                  return response.read()

          found = None
          page = 1
          while found is None:
              listing = json.loads(get(f'https://api.github.com/repos/{repo}/actions/artifacts?per_page=100&page={page}'))
              artifacts = listing.get('artifacts', [])
              if not artifacts:
                  break
              for artifact in artifacts:
                  if artifact.get('expired'):
                      continue
                  try:
                      payload = get(artifact['archive_download_url'])
                      with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                          for member in archive.infolist():
                              if member.is_dir() or not member.filename.endswith('ta047-full.tar.xz'):
                                  continue
                              data = archive.read(member)
                              digest = hashlib.sha256(data).hexdigest()
                              print(f"candidate artifact={artifact['id']} member={member.filename} sha256={digest}")
                              if digest == expected:
                                  found = (artifact['id'], member.filename, data)
                                  break
                  except Exception as exc:
                      print(f"artifact {artifact.get('id')} skipped: {exc}", file=sys.stderr)
                  if found is not None:
                      break
              page += 1

          if found is None:
              raise SystemExit('No retained artifact contains the exact TA-047 archive')

          artifact_id, member, data = found
          out = pathlib.Path('/tmp/ta047-full.tar.xz')
          out.write_bytes(data)
          pathlib.Path('/tmp/ta047-source.txt').write_text(
              f'artifact_id={artifact_id}\nmember={member}\nsha256={expected}\nsize={len(data)}\n',
              encoding='utf-8',
          )
          print(f'published source artifact={artifact_id} member={member} size={len(data)}')
          PY

      - name: Publish immutable transfer branch
        run: |
          set -euo pipefail
          test "$(sha256sum /tmp/ta047-full.tar.xz | awk '{print $1}')" = "2ec193ca4a27535403b149c8bbbc613ce088e40134406a79144bd80556539068"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch --orphan tmp/ta047-transfer
          git rm -rf .
          mkdir -p transfer
          cp /tmp/ta047-full.tar.xz transfer/ta047-full.tar.xz
          cp /tmp/ta047-source.txt transfer/TA047_SOURCE.txt
          cat > transfer/README.md <<'EOF'
          Temporary exact-hash transfer for GAME TA-047 delivery.

          This branch is deleted after GAME mainline delivery and receipt verification.
          EOF
          git add -f transfer
          git commit -m "[TEMP][TA-047] Publish exact delivery archive"
          git push --force origin HEAD:refs/heads/tmp/ta047-transfer
